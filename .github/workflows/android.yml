name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The SDK is not taken from whatever the runner image happens to carry:
      # the platform and the build tools the build asks for are named here, so
      # a change in the image cannot quietly change the build.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lintPhoneDebug lintTvDebug

      - name: Debug APKs
        run: ./gradlew assemblePhoneDebug assembleTvDebug

      - name: Upload the phone debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SoluPlay-phone-debug
          path: app/build/outputs/apk/phone/debug/*.apk
          if-no-files-found: error

  release:
    name: Signed release APK
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The same SDK the build job used, named rather than inherited: a release
      # must not be signed by a build made with a different toolchain than the
      # one that was tested.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v4

      # The release key never lives in the repository. It arrives as a secret,
      # is written to a gitignored properties file, and is deleted with the
      # runner at the end of the job.
      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is not set on this repository." >&2
            echo "A release is signed with the key in the repository secrets:" >&2
            echo "  KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD" >&2
            exit 1
          fi
          mkdir -p keystore
          # The key is piped in, never named. `base64 --decode "$VAR"` reads
          # its argument as a file name, and when that fails the error prints
          # the argument back — which would put the key in a public log.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > keystore/release.jks
          if [ ! -s keystore/release.jks ]; then
            echo "The release key did not decode." >&2
            exit 1
          fi
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build the signed APK
        run: ./gradlew writeVersionInfo assemblePhoneRelease

      # One file is published, and it is the phone flavour: that build carries
      # the television launcher as well, so one download covers a handset and
      # a TV box. The tv flavour is built for the split described in PLAN.md
      # section 12 and is not published until that split is real.
      - name: Name the asset and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/phone/release/app-phone-release.apk dist/SoluPlay.apk

          # The notes for a release live in the repository beside the tag, so
          # what the release page says is what was written down before the
          # tag was cut — and not a list the publishing job invented.
          notes_file="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes_file" ]; then
            gh release create "$GITHUB_REF_NAME" dist/SoluPlay.apk --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" dist/SoluPlay.apk --generate-notes
          fi

      # The manifest is what the app reads, and its fingerprint is what the app
      # checks the download against. Writing it by hand after a release is one
      # more step where the number can be wrong, and a wrong number makes every
      # device refuse the update. So the job that publishes the build writes
      # the manifest too, from the bytes it has just published.
      #
      # Both variants are given the same file: the phone flavour carries the
      # television launcher, so one download covers both surfaces until the
      # split in PLAN.md section 12 is real.
      - name: Publish the manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_code=$(jq -r .versionCode app/build/version-info.json)
          version_name=$(jq -r .versionName app/build/version-info.json)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/SoluPlay.apk"
          sha=$(sha256sum dist/SoluPlay.apk | cut -d' ' -f1)
          size=$(stat -c%s dist/SoluPlay.apk)

          # The manifest carries the first line of the same notes file the
          # release page shows in full, so the line the app reads under the
          # update button and the page it opens cannot say different things.
          notes="SoluPlay ${version_name}"
          notes_file="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes_file" ]; then
            notes=$(head -n 1 "$notes_file")
          fi

          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "The fingerprint is not a sha256: $sha" >&2
            exit 1
          fi

          jq \
            --arg vn "$version_name" \
            --arg notes "$notes" \
            --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "$url" \
            --arg sha "$sha" \
            --argjson size "$size" \
            --argjson vc "$version_code" \
            '.versionCode = $vc
             | .versionName = $vn
             | .updatedAt = $now
             | .releaseNotes = $notes
             | .apkUrl = $url
             | .downloadUrl = $url
             | .fileName = "SoluPlay.apk"
             | .sha256 = $sha
             | .sizeBytes = $size
             | .variants.phone.url = $url
             | .variants.phone.fileName = "SoluPlay.apk"
             | .variants.phone.sha256 = $sha
             | .variants.phone.sizeBytes = $size
             | .variants.tv.url = $url
             | .variants.tv.fileName = "SoluPlay.apk"
             | .variants.tv.sha256 = $sha
             | .variants.tv.sizeBytes = $size' \
            latest.json > latest.json.new

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # The commit is made on top of the branch as it is now, not on top
          # of the tag: the branch may have moved on since the tag was cut,
          # and a push from the tag would then be refused.
          git fetch origin main
          git checkout -B publish-manifest origin/main
          mv latest.json.new latest.json
          git add latest.json
          git commit -m "Publish the manifest for $version_name"
          git push origin publish-manifest:main

      - name: Summarise the release
        run: |
          set -euo pipefail
          sha256sum dist/SoluPlay.apk
          ls -l dist/SoluPlay.apk
          cat app/build/version-info.json
