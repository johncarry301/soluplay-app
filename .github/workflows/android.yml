name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lintPhoneDebug lintTvDebug

      - name: Debug APKs
        run: ./gradlew assemblePhoneDebug assembleTvDebug

      - name: Upload the phone debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SoluPlay-phone-debug
          path: app/build/outputs/apk/phone/debug/*.apk
          if-no-files-found: error

  release:
    name: Signed release APK
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The release key never lives in the repository. It arrives as a secret,
      # is written to a gitignored properties file, and is deleted with the
      # runner at the end of the job.
      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is not set on this repository." >&2
            exit 1
          fi
          mkdir -p keystore
          base64 --decode "$KEYSTORE_BASE64" > keystore/release.jks
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build the signed APK
        run: ./gradlew assemblePhoneRelease

      - name: Name the asset and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/phone/release/app-phone-release.apk dist/SoluPlay.apk
          gh release create "$GITHUB_REF_NAME" dist/SoluPlay.apk --generate-notes

      - name: Summarise the release
        run: |
          set -euo pipefail
          sha256sum dist/SoluPlay.apk
          ls -l dist/SoluPlay.apk
